[package]
name = "host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs agent JavaScript in QuickJS-on-wasmtime and brokers every capability."

[lib]
name = "evalien_sandbox"

[[bin]]
name = "sandbox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-std", "io-util"] }
wasmtime = { version = "50", default-features = false, features = ["runtime", "std", "anyhow"] }

[build-dependencies]
wasmtime = { version = "50", default-features = false, features = ["cranelift", "std", "anyhow"] }
