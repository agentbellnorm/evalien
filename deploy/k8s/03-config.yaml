# Everything that isn't secret. The API key and Matrix access token live in
# the evalien-secrets Secret; see README.md for how to create it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: evalien-config
  namespace: evalien
data:
  MODEL: anthropic/claude-sonnet-5-5
  # Per UTC day. When it's spent the agent pauses until midnight and says so.
  MODEL_BUDGET_USD: "3"
  # Prometheus scrapes this; see the pod annotations and the NetworkPolicy.
  METRICS_ADDR: "0.0.0.0:9464"
  CONNECTIONS_FILE: /config/connections.toml
  # OAuth: where the callback listens, and how the browser reaches it (tailnet only).
  CALLBACK_ADDR: "0.0.0.0:8080"
  OAUTH_REDIRECT_URL: https://evalien.bushnet.diy/oauth/callback
  # The in-cluster Synapse service; this traffic never leaves the cluster.
  MATRIX_HOMESERVER: http://matrix-synapse.skum-matrix.svc.cluster.local:8008
  # The room the agent's account has been invited to, exactly as the client
  # shows it (room version 12 IDs have no ":server" part), and the one user
  # the agent listens to.
  MATRIX_ROOM_ID: "!aYCSALsizJZOlVOtoAtq9EEGY_Tg8dKoISU2qPZ2nVg"
  MATRIX_OWNER: "@morgan:matrix.skum.dev"
---
# External services the gateway attaches credentials for. Secrets are named
# here and live in the evalien-secrets Secret. See docs/connectors.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: evalien-connections
  namespace: evalien
data:
  connections.toml: |
    [connections.google-calendar]
    kind = "oauth"
    provider = "google"
    origins = ["https://www.googleapis.com"]
    scopes = ["https://www.googleapis.com/auth/calendar.readonly"]
    client_id = { secret = "GOOGLE_CLIENT_ID" }
    client_secret = { secret = "GOOGLE_CLIENT_SECRET" }

    [connections.seb]
    kind = "bankid"
    provider = "seb"
    origins = ["https://apps.seb.se"]
    keepalive_for = "1h"

    # [connections.example]
    # kind = "api_key"
    # origins = ["https://api.example.com"]
    # header = { name = "Authorization", value = "Bearer {key}" }
    # key = { secret = "EXAMPLE_API_KEY" }
