# The evalien-secrets Secret, synced from 1Password (vault "Bushnet", item "evalien",
# one field per key) by the cluster's External Secrets Operator. Change values in
# 1Password, or with ./scripts/set-secret.sh; Reloader restarts the pod when they land.
#
# !! VAULT_KEY encrypts the tokens and sessions connections keep in the vault on /data.
# Never rotate or regenerate it: everything already in the vault becomes unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: evalien-secrets
  namespace: evalien
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: evalien-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: evalien/ANTHROPIC_API_KEY
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: evalien/GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: evalien/GOOGLE_CLIENT_SECRET
    - secretKey: MATRIX_ACCESS_TOKEN
      remoteRef:
        key: evalien/MATRIX_ACCESS_TOKEN
    - secretKey: VAULT_KEY
      remoteRef:
        key: evalien/VAULT_KEY
