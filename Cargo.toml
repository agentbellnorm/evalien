[package]
name = "evalien"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "An autonomous agent whose only tool is eval(), driven by an event loop."
default-run = "evalien"

[workspace]
resolver = "3"
members = [".", "guest"]

[workspace.package]
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.23"
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
cookie_store = { version = "0.22", features = ["serde_json"] }
dotenvy = "0.15"
getrandom = "0.4"
humantime = "2"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "cookies"] }
reqwest_cookie_store = "0.10"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal", "io-std", "io-util", "net"] }
url = "2"
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift", "component-model", "async", "std", "anyhow", "parallel-compilation"] }
wasmtime-wasi = "50"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.guest]
opt-level = "s"

# Cranelift compiling the guest at startup is painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
