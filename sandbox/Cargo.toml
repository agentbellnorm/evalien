[workspace]
resolver = "3"
members = ["guest", "host"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The guest is size- and speed-sensitive and gets precompiled into the host.
[profile.release.package.guest]
opt-level = "s"

# Cranelift compiling the guest is painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
